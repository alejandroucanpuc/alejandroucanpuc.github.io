# Lychee link-check config for generated Pelican output.
verbose = true
no_progress = true
exclude_mail = true
max_retries = 2
retry_wait_time = 2
timeout = 20
root_dir = "output"

# External hosts that occasionally throttle automation can be excluded here if needed.
exclude = [
	"https://doi.org/10.1080/10586458.2022.2093802",
]
