{% if GOOGLE_ANALYTICS %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ GOOGLE_ANALYTICS }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag() { dataLayer.push(arguments); }
gtag("js", new Date());
gtag("config", "{{ GOOGLE_ANALYTICS }}", { "anonymize_ip": true });

(function () {
    var path = window.location.pathname || "/";
    var courseScrollMilestones = {50: false, 90: false};
    var courseSessionStart = Date.now();

    function track(eventName, payload) {
        var eventPayload = payload || {};
        eventPayload.page_path = path;
        gtag("event", eventName, eventPayload);
    }

    function toUrl(rawHref) {
        try {
            return new URL(rawHref, window.location.href);
        } catch (error) {
            return null;
        }
    }

    function outboundTypeForHost(hostname) {
        if (hostname.indexOf("github.com") !== -1) {
            return "github";
        }
        if (hostname.indexOf("orcid.org") !== -1) {
            return "orcid";
        }
        if (hostname.indexOf("teams.microsoft.com") !== -1 || hostname.indexOf("youtube.com") !== -1) {
            return "seminar";
        }
        return "other";
    }

    function emitPageGoals() {
        if (path.indexOf("/pages/repositories/") === 0) {
            track("repository_visit", { "goal_group": "navigation" });
        }
        if (path.indexOf("/pages/courses/") === 0) {
            track("course_page_view", { "goal_group": "engagement" });
        }
    }

    function emitPerformanceMetrics() {
        var entries = performance.getEntriesByType ? performance.getEntriesByType("navigation") : [];
        if (!entries || !entries.length) {
            return;
        }

        var nav = entries[0];
        var loadMs = Math.round(nav.loadEventEnd || 0);
        var ttfbMs = Math.round(nav.responseStart || 0);
        var domInteractiveMs = Math.round(nav.domInteractive || 0);
        track("page_performance", {
            "load_ms": loadMs,
            "ttfb_ms": ttfbMs,
            "dom_interactive_ms": domInteractiveMs,
            "goal_group": "performance"
        });
    }

    function setupWebVitals() {
        if (!("PerformanceObserver" in window)) {
            return;
        }

        var lcpValue = 0;
        var clsValue = 0;

        try {
            var lcpObserver = new PerformanceObserver(function (entryList) {
                var entries = entryList.getEntries();
                if (entries.length) {
                    lcpValue = Math.round(entries[entries.length - 1].startTime);
                }
            });
            lcpObserver.observe({ type: "largest-contentful-paint", buffered: true });
        } catch (error) {
            // no-op
        }

        try {
            var clsObserver = new PerformanceObserver(function (entryList) {
                entryList.getEntries().forEach(function (entry) {
                    if (!entry.hadRecentInput) {
                        clsValue += entry.value;
                    }
                });
            });
            clsObserver.observe({ type: "layout-shift", buffered: true });
        } catch (error) {
            // no-op
        }

        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState !== "hidden") {
                return;
            }
            if (lcpValue > 0) {
                track("web_vital_lcp", { "value_ms": lcpValue, "goal_group": "performance" });
            }
            if (clsValue > 0) {
                track("web_vital_cls", { "value": Number(clsValue.toFixed(4)), "goal_group": "performance" });
            }
        });
    }

    function setupCourseScrollTracking() {
        if (path.indexOf("/pages/courses/") !== 0) {
            return;
        }

        function evaluateScroll() {
            var doc = document.documentElement;
            var scrollable = doc.scrollHeight - window.innerHeight;
            if (scrollable <= 0) {
                return;
            }
            var percentage = ((window.scrollY || window.pageYOffset || 0) / scrollable) * 100;
            [50, 90].forEach(function (milestone) {
                if (!courseScrollMilestones[milestone] && percentage >= milestone) {
                    courseScrollMilestones[milestone] = true;
                    track("course_scroll_depth", {
                        "depth_percent": milestone,
                        "goal_group": "engagement"
                    });
                }
            });
        }

        window.addEventListener("scroll", evaluateScroll, { passive: true });
        evaluateScroll();

        window.addEventListener("beforeunload", function () {
            var durationSeconds = Math.round((Date.now() - courseSessionStart) / 1000);
            if (durationSeconds >= 45) {
                track("course_engaged_session", {
                    "engagement_seconds": durationSeconds,
                    "goal_group": "engagement"
                });
            }
        });
    }

    document.addEventListener("click", function (event) {
        var link = event.target.closest ? event.target.closest("a[href]") : null;
        if (!link) {
            return;
        }

        var href = link.getAttribute("href") || "";
        var absoluteUrl = toUrl(href);
        if (!absoluteUrl) {
            return;
        }

        var isExternal = absoluteUrl.origin !== window.location.origin;
        var label = (link.textContent || "").trim().slice(0, 120);

        if (href.indexOf("/pages/contact/") === 0 || absoluteUrl.pathname.indexOf("/pages/contact/") === 0) {
            track("contact_click", {
                "goal_group": "conversion",
                "link_text": label || "contact"
            });
        }

        if (path.indexOf("/pages/courses/") === 0 && href.indexOf("slides") !== -1) {
            track("course_material_click", {
                "goal_group": "engagement",
                "link_text": label || "course_material",
                "link_url": absoluteUrl.href
            });
        }

        if (absoluteUrl.hostname.indexOf("teams.microsoft.com") !== -1) {
            track("seminar_registration_click", {
                "goal_group": "conversion",
                "link_url": absoluteUrl.href,
                "link_text": label || "seminar_registration"
            });
        }

        if (isExternal) {
            var outboundType = outboundTypeForHost(absoluteUrl.hostname.toLowerCase());
            track("outbound_click", {
                "goal_group": "navigation",
                "outbound_type": outboundType,
                "link_host": absoluteUrl.hostname,
                "link_url": absoluteUrl.href,
                "link_text": label || "outbound_link"
            });

            if (outboundType === "github" && path.indexOf("/pages/repositories/") === 0) {
                track("repository_outbound_click", {
                    "goal_group": "conversion",
                    "link_url": absoluteUrl.href,
                    "link_text": label || "repository_link"
                });
            }
        }
    });

    emitPageGoals();
    setupCourseScrollTracking();
    setupWebVitals();
    window.addEventListener("load", emitPerformanceMetrics);
})();
</script>
{% endif %}
